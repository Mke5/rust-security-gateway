# rust-gateway configuration file

[server]
host = "0.0.0.0"
port = 3000

[backend]
url = "http://localhost:8080"
# Multiple backend URLs for load balancing (overrides url if non-empty)
urls = []
timeout_seconds = 30

[backend.retry]
max_retries = 2
base_delay_ms = 100

[backend.circuit_breaker]
enabled = true
failure_threshold = 5
recovery_timeout_secs = 30

[backend.health_check]
enabled = true
interval_secs = 10
timeout_secs = 5
path = "/health"

[backend.load_balancing]
strategy = "least_connections"

[rate_limit]
max_requests = 100
window_seconds = 60

[cache]
ttl_seconds = 300
max_items = 1000

[ip_filter]
blacklist = ["192.168.1.100", "10.0.0.1"]
whitelist = []

[bot_detection]
block_missing_user_agent = true
bad_user_agents = ["sqlmap", "nikto", "masscan", "zgrab", "nmap", "python-requests/2.18", "curl/7.54"]

[waf]
max_body_size = 1048576

[tls]
enabled = false
cert_path = "certs/cert.pem"
key_path = "certs/key.pem"
client_ca_path = ""
http2 = false

[tls.hsts]
enabled = false
max_age = 31536000
include_subdomains = true
preload = false

[logging]
format = "json"

[pool]
max_idle_per_host = 32
idle_timeout_secs = 90

[cors]
enabled = false
allowed_origins = []
allowed_methods = ["GET", "POST", "PUT", "DELETE", "PATCH"]
allowed_headers = ["Content-Type", "Authorization", "X-Request-ID"]
allow_credentials = true
max_age_secs = 86400

[auth]
enabled = false
api_keys = []
jwks_url = ""
jwt_secret = ""
jwt_issuer = ""
jwt_audience = ""

[acme]
enabled = false
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
email = ""
domains = []
cache_path = "acme_cache"
use_staging = false

[[route_rate_limits]]
path = "/api/login"
max_requests = 20
window_seconds = 60
