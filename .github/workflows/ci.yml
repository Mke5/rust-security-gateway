name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets

  test:
    name: Test (${{ matrix.os }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: [check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Set linker (cross-compile)
        if: matrix.linker
        run: echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/rust-gateway${{ matrix.ext }}"
          PKG="rust-gateway-${{ matrix.target }}${{ matrix.ext }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "$BIN" "$PKG"
          else
            cp "$BIN" "$PKG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-gateway-${{ matrix.target }}
          path: rust-gateway-${{ matrix.target }}*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-gateway-*
          merge-multiple: true
      - name: Create release archives
        shell: bash
        run: |
          for f in rust-gateway-*; do
            if [[ "$f" == *.exe ]]; then
              base="${f%.exe}"
              mv "$f" "rust-gateway.exe"
              zip "${base}.zip" "rust-gateway.exe"
              rm "rust-gateway.exe"
            else
              mv "$f" "rust-gateway"
              tar czf "${f}.tar.gz" "rust-gateway"
              rm "rust-gateway"
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rust-gateway-*.tar.gz
            rust-gateway-*.zip
          generate_release_notes: true
